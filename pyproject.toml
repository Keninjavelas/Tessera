[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "tessera"
version = "0.1.0"
description = "Tessera — Production AI Intelligence Ingestion, Multi-Tier LLM Extraction & Entity Resolution Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "aiosqlite>=0.20.0",
    "structlog>=24.1.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "trafilatura>=1.10.0",
    "rapidfuzz>=3.9.0",
    "python-dateutil>=2.9.0",
    "openpyxl>=3.1.2",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "playwright>=1.45.0",
    "reportlab>=4.2.0",
    "pypdf>=4.2.0",
    "gspread>=6.1.0",
    "google-auth>=2.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "mypy>=1.10.0",
    "types-python-dateutil>=2.9.0",
    "types-beautifulsoup4>=4.12.0",
    "ruff>=0.4.8",
]

[project.scripts]
tessera = "tessera.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["tessera"]

[[tool.mypy.overrides]]
module = [
    "trafilatura",
    "trafilatura.*",
    "rapidfuzz",
    "rapidfuzz.*",
    "openpyxl",
    "openpyxl.*",
    "playwright",
    "playwright.*",
    "gspread",
    "gspread.*",
    "google.oauth2.*",
    "reportlab.*",
    "pypdf",
    "pypdf.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
